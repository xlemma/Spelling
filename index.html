<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>英语听写 · 多年级多Week</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>📘 听写单词</h1>
    <div class="subhead">
      可多选年级与 Week · 例句难度匹配年级 · 已学词统计 <span class="auto-badge">⚡ 自动下载已开启</span>
    </div>

    <div class="panel">
      <div class="panel-title">
        <span>📚 年级</span>
        <button class="toggle-all" id="toggleAllGrades">全选/清空</button>
      </div>
      <div class="chips" id="gradeChips"></div>
    </div>

    <div class="panel">
      <div class="panel-title">
        <span>📅 Week</span>
        <button class="toggle-all" id="toggleAllWeeks">全选/清空</button>
      </div>
      <div class="chips" id="weekChips"></div>
    </div>

    <div id="wordsContainer"></div>

    <div class="action-buttons">
      <button class="btn btn-primary" id="downloadBtn">📥 下载结果</button>
      <button class="btn" id="statsBtn">📊 已学词统计</button>
      <button class="btn" id="clearAllBtn">🧹 清空勾选</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
    <div class="footer-note">勾选 = 写对 · 留空 = 写错 · 全部判定后自动下载</div>
  </div>

  <!-- 统计弹窗 -->
  <div class="modal-overlay" id="statsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>📊 已学词汇统计</h2>
        <button class="modal-close" id="statsClose">×</button>
      </div>
      <div class="modal-body" id="statsBody"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="statsDownload">📥 下载统计</button>
      </div>
    </div>
  </div>

  <!-- data.js 加时间戳，防止浏览器缓存 -->
  <script>
    document.write('<script src="data.js?v=' + Date.now() + '"><\/script>');
  </script>
  <script src="app.js"></script>
</body>
</html>
