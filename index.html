<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>英语听写 · 多选 Week 版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>📘 听写单词</h1>
    <div class="subhead">
      年级单选 · Week 多选动态加载 <span class="auto-badge">⚡ 单字分页</span>
    </div>

    <!-- 错词本入口 -->
    <div class="top-action-bar">
      <button class="btn btn-warning btn-block" id="wrongWordsBtn">⚠️ 查看错词本</button>
    </div>

    <!-- 年级与多选 Week 选择面板 -->
    <div class="panel">
      <div class="panel-title">
        <span>📚 选择年级</span>
      </div>
      <div class="select-item" style="margin-bottom: 14px;">
        <select id="gradeSelect" class="form-select">
          <option value="">请选择年级</option>
        </select>
      </div>

      <div class="panel-title" style="display: flex; justify-content: space-between; align-items: center;">
        <span>📅 选择 Week (可多选)</span>
        <div>
          <button class="text-btn" id="selectAllWeeks">全选</button>
          <span style="color:#dce3ec; margin:0 4px;">|</span>
          <button class="text-btn" id="clearAllWeeks">清空</button>
        </div>
      </div>
      <!-- Week 多选复选框容器 -->
      <div id="weekCheckboxContainer" class="week-checkbox-container">
        <div class="empty-state" style="padding: 10px;">请先选择年级</div>
      </div>
    </div>

    <div id="wordsContainer"></div>

    <div class="action-buttons">
      <button class="btn btn-primary" id="downloadBtn">📥 导出 Excel</button>
      <button class="btn btn-success" id="submitBtn">🚀 提交进度</button>
      <button class="btn" id="clearAllBtn">🧹 清空勾选</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
    <div class="footer-note">点1次=对(✓) · 点2次=错(✗) · 点3次=空 · 点击“下一个”自动提交</div>
  </div>

  <!-- 引入 SheetJS 用于导出 Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
