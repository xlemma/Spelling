<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>英语听写 · 动态单字分页版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>📘 听写单词</h1>
    <div class="subhead">
      动态单字分页 · 已学词统计 <span class="auto-badge">⚡ 30秒自动同步已开启</span>
    </div>

    <!-- 错词本入口 -->
    <div class="top-action-bar">
      <button class="btn btn-warning btn-block" id="wrongWordsBtn">⚠️ 查看错词本</button>
    </div>

    <!-- 动态下拉选择面板 -->
    <div class="panel">
      <div class="panel-title">
        <span>📚 年级与 Week 选择</span>
      </div>
      <div class="select-group">
        <div class="select-item">
          <label for="gradeSelect">年级</label>
          <select id="gradeSelect" class="form-select">
            <option value="">请选择年级</option>
          </select>
        </div>
        <div class="select-item">
          <label for="weekSelect">Week</label>
          <select id="weekSelect" class="form-select">
            <option value="">请选择 Week</option>
          </select>
        </div>
      </div>
    </div>

    <div id="wordsContainer"></div>

    <div class="action-buttons">
      <button class="btn btn-primary" id="downloadBtn">📥 导出 Excel</button>
      <button class="btn btn-success" id="submitBtn">🚀 提交进度</button>
      <button class="btn" id="statsBtn">📊 已学词统计</button>
      <button class="btn" id="clearAllBtn">🧹 清空勾选</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
    <div class="footer-note">点1次=对(✓) · 点2次=错(✗) · 点3次=空 · 每半分钟自动同步</div>
  </div>

  <!-- 已学词统计弹窗 -->
  <div class="modal-overlay" id="statsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>📊 已学词汇统计</h2>
        <button class="modal-close" id="statsClose">×</button>
      </div>
      <div class="modal-body" id="statsBody"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="statsDownload">📥 下载统计</button>
      </div>
    </div>
  </div>
  
  <!-- 引入 SheetJS 用于导出 Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
